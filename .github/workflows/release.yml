# Run by hand (Actions -> Release -> Run workflow) to build signed APKs and
# publish them as a GitHub release, versioned from pubspec.yaml. The app checks
# releases/latest and offers the APK for its ABI.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new, shown in the app. Optional; separate points with ;"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "version: 1.2.0+5" -> 1.2.0
          VERSION=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ -z "$VERSION" ]; then echo "::error::No version like 1.2.0 in pubspec.yaml"; exit 1; fi
          # Fail now rather than after the build if this version was already released.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released; bump version in pubspec.yaml"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle # Gradle dependencies and wrapper

      # The runner image lacks Flutter's NDK, so the build would download it every run.
      # shortcut: version must match flutter.ndkVersion; update it when bumping Flutter.
      - uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true # Flutter SDK
          pub-cache: true # Dart packages

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the release key the build would fall back to the debug key, which must never be published.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter test

      - name: Build APKs
        run: |
          # The run number keeps versionCode increasing.
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "magpie-$VERSION-$abi.apk"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          # "a; - b" -> "- a\n- b": the app shows each "- " line as a point, and nothing when empty.
          printf '%s' "$NOTES" | tr ';' '\n' \
            | sed -E 's/^[[:space:]]*([-*•][[:space:]]*)?//; s/[[:space:]]+$//; /^$/d; s/^/- /' > notes.md
          gh release create "v$VERSION" build/app/outputs/flutter-apk/magpie-*.apk \
            --target "$GITHUB_SHA" --title "Magpie $VERSION" --notes-file notes.md
