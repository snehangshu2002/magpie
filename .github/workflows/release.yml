# Run by hand (Actions -> Release -> Run workflow) to build signed APKs and
# publish them as a GitHub release. The app checks releases/latest and offers
# the APK for its ABI.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 1.2.0 (becomes the release tag v1.2.0)'
        required: true
      notes:
        description: "What's new, shown in the app. Optional; separate points with ;"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0, got '$VERSION'"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the release key the build would fall back to the debug key, which must never be published.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter test

      - name: Build APKs
        run: |
          # The run number keeps versionCode increasing.
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "magpie-$VERSION-$abi.apk"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          # "a; - b" -> "- a\n- b": the app shows each "- " line as a point, and nothing when empty.
          printf '%s' "$NOTES" | tr ';' '\n' \
            | sed -E 's/^[[:space:]]*([-*•][[:space:]]*)?//; s/[[:space:]]+$//; /^$/d; s/^/- /' > notes.md
          gh release create "v$VERSION" build/app/outputs/flutter-apk/magpie-*.apk \
            --target "$GITHUB_SHA" --title "Magpie $VERSION" --notes-file notes.md
